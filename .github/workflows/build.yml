name: Build Last.fm YouTube Music Tweak + Inject IPA

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: 'Last.fm API Key'
        required: true
        default: '3a786bb0ba066718c083ab3c316e7585'
      api_secret:
        description: 'Last.fm API Secret'
        required: true
        default: '69dc74de5bb43846ac88573c243e4a0a'

jobs:
  build:
    runs-on: macos-latest
    steps:
      # ── 1. Checkout this repo (contains the IPA) ───────────
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify IPA exists
        run: |
          ls -lh YouTubeMusic.ipa
          file YouTubeMusic.ipa | grep -q "Zip archive" && echo "✅ Valid IPA found" || { echo "❌ IPA missing or invalid"; exit 1; }

      # ── 2. Setup Theos ──────────────────────────────────────
      - name: Install Dependencies
        run: |
          brew install ldid dpkg

      - name: Clone Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git ~/theos
          echo "THEOS=${{ runner.home }}/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          mkdir -p ~/theos/sdks
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar xz --strip-components=1 -C ~/theos/sdks

      # ── 3. Clone the tweak source (ORIGINAL — no changes) ───
      - name: Clone lastfm-yt-music source
        run: |
          git clone --depth 1 https://github.com/marioparaschiv/lastfm-yt-music.git tweak-source

      - name: Configure API Keys in Makefile
        run: |
          cd tweak-source
          sed -i '' "s/LASTFM_API_KEY = xxx/LASTFM_API_KEY = ${{ github.event.inputs.api_key }}/g" Makefile
          sed -i '' "s/LASTFM_API_SECRET = xxx/LASTFM_API_SECRET = ${{ github.event.inputs.api_secret }}/g" Makefile

      # ── 4. Build the .dylib ─────────────────────────────────
      - name: Build Tweak
        env:
          THEOS: /Users/runner/theos
        run: |
          cd tweak-source
          make clean package FINALPACKAGE=1

      - name: Extract dylib from .deb
        run: |
          cd tweak-source/packages
          DEB_FILE=$(ls *.deb | head -1)
          mkdir extracted
          dpkg-deb -x "$DEB_FILE" extracted/
          echo "=== Contents of .deb ==="
          find extracted -name "*.dylib" -o -name "*.plist" | sort
          DYLIB=$(find extracted -name "LastFMYouTubeMusic.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            echo "❌ Dylib not found in .deb!"
            echo "Full .deb contents:"
            find extracted -type f | head -30
            exit 1
          fi
          cp "$DYLIB" "$GITHUB_WORKSPACE/LastFMYouTubeMusic.dylib"
          echo "=== Dylib extracted from: $DYLIB ==="
          file "$GITHUB_WORKSPACE/LastFMYouTubeMusic.dylib"

      # ── 5. Upload dylib as artifact (for debugging) ─────────
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LastFMYouTubeMusic-dylib
          path: LastFMYouTubeMusic.dylib

      # ── 6. Install Azule (IPA injection tool) ───────────────
      - name: Install Azule
        run: |
          git clone --depth 1 https://github.com/Al4ise/Azule.git ~/azule
          chmod +x ~/azule/azule

      # ── 7. Inject dylib into IPA ────────────────────────────
      - name: Inject dylib into IPA
        run: |
          echo "Injecting LastFMYouTubeMusic.dylib into YouTubeMusic.ipa"
          ~/azule/azule -i YouTubeMusic.ipa -f LastFMYouTubeMusic.dylib -o "YouTubeMusic_LastFM.ipa"

      # ── 8. Upload final IPA ─────────────────────────────────
      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeMusic-LastFM
          path: YouTubeMusic_LastFM.ipa
