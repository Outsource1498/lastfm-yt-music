name: Build Last.fm YouTube Music Tweak + Inject IPA (Ubuntu)

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: 'Last.fm API Key'
        required: true
        default: '3a786bb0ba066718c083ab3c316e7585'
      api_secret:
        description: 'Last.fm API Secret'
        required: true
        default: '69dc74de5bb43846ac88573c243e4a0a'
      clean_ipa_url:
        description: 'Direct URL to a clean, decrypted YouTube Music IPA (leave empty to use YouTubeMusic.ipa in repo)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout this repo ────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Install Ubuntu dependencies ──────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential fakeroot rsync curl perl zip unzip git \
            libxml2-utils python3 python3-pip python3-venv

      # ── 3. Setup Theos + iOS SDK + Linux toolchain ───────────
      - name: Setup Theos
        run: |
          export THEOS=~/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS SDK
        run: |
          $THEOS/bin/install-sdk latest

      - name: Install iOS toolchain for Linux
        run: |
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -sL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" | \
            tar -xJvf - -C "$THEOS/toolchain/"
          echo "Toolchain contents:"
          ls -la "$THEOS/toolchain/linux/iphone/bin" | head -10
        env:
          THEOS: ${{ env.THEOS }}

      # ── 4. Clone the tweak source (ORIGINAL — no changes) ───
      - name: Clone lastfm-yt-music source
        run: |
          git clone --depth 1 https://github.com/marioparaschiv/lastfm-yt-music.git tweak-source

      - name: Configure API Keys in Makefile
        run: |
          cd tweak-source
          sed -i "s/LASTFM_API_KEY = xxx/LASTFM_API_KEY = ${{ github.event.inputs.api_key }}/g" Makefile
          sed -i "s/LASTFM_API_SECRET = xxx/LASTFM_API_SECRET = ${{ github.event.inputs.api_secret }}/g" Makefile

      # ── 5. Build the .dylib ─────────────────────────────────
      - name: Build Tweak
        run: |
          cd tweak-source
          make clean package FINALPACKAGE=1

      - name: Extract dylib from .deb
        run: |
          cd tweak-source/packages
          DEB_FILE=$(ls *.deb | head -1)
          mkdir extracted
          dpkg-deb -x "$DEB_FILE" extracted/
          echo "=== Contents of .deb ==="
          find extracted -name "*.dylib" -o -name "*.plist" | sort
          DYLIB=$(find extracted -name "LastFMYouTubeMusic.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            echo "❌ Dylib not found in .deb!"
            echo "Full .deb contents:"
            find extracted -type f | head -30
            exit 1
          fi
          cp "$DYLIB" "$GITHUB_WORKSPACE/LastFMYouTubeMusic.dylib"
          echo "=== Dylib extracted from: $DYLIB ==="
          file "$GITHUB_WORKSPACE/LastFMYouTubeMusic.dylib"

      - name: Upload dylib artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: LastFMYouTubeMusic-dylib
          path: LastFMYouTubeMusic.dylib

      # ── 6. Install cyan (Linux-compatible IPA injector) ─────
      - name: Install cyan
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --force-reinstall "https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip"
          cyan --version

      # ── 7. Obtain clean IPA ────────────────────────────────
      - name: Download clean IPA from URL
        if: ${{ github.event.inputs.clean_ipa_url != '' }}
        run: |
          echo "Downloading clean IPA from provided URL..."
          curl -L -o YouTubeMusic_Clean.ipa "${{ github.event.inputs.clean_ipa_url }}"
          file YouTubeMusic_Clean.ipa | grep -qi "zip" && echo "✅ Downloaded valid IPA/ZIP" || { echo "❌ Downloaded file is not a valid IPA/ZIP"; file YouTubeMusic_Clean.ipa; exit 1; }

      - name: Use local IPA fallback
        if: ${{ github.event.inputs.clean_ipa_url == '' }}
        run: |
          if [ ! -f YouTubeMusic.ipa ]; then
            echo "❌ No clean_ipa_url provided and YouTubeMusic.ipa not found in repo."
            exit 1
          fi
          cp YouTubeMusic.ipa YouTubeMusic_Clean.ipa
          echo "Using local YouTubeMusic.ipa (make sure it is clean/decrypted)"

      # ── 8. Inject dylib into clean IPA ─────────────────────
      - name: Inject dylib with cyan
        run: |
          mkdir -p output
          cyan -i YouTubeMusic_Clean.ipa -o output/YouTubeMusic_LastFM.ipa -f LastFMYouTubeMusic.dylib --overwrite
          echo "=== Patched IPA created ==="
          ls -lh output/YouTubeMusic_LastFM.ipa

      # ── 9. Upload final IPA ─────────────────────────────────
      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeMusic-LastFM
          path: output/YouTubeMusic_LastFM.ipa
